metadata:
  name: weston-simple-shm
  format: "Lava-Test Test Definition 1.0"
  description: "Validate the Weston shared-memory client through the active Wayland runtime."
  os:
    - linux
  scope:
    - functional

params:
  DURATION: "15s"
  WAIT_SECS: "10"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Graphics/weston-simple-shm
    - DURATION="${DURATION}" WAIT_SECS="${WAIT_SECS}" ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh weston-simple-shm.res || true
