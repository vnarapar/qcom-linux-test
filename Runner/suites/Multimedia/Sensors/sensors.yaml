metadata:
  name: Sensors
  format: "Lava-Test Test Definition 1.0"
  description: "Dynamic Sensors validation with optional Qualcomm Sensors overlay package recovery."
  os:
    - linux
  scope:
    - functional
    - multimedia

params:
  OVERLAY: "0"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Sensors
    - if [ "${OVERLAY}" = "1" ]; then ./run.sh --overlay || true; else ./run.sh || true; fi
    - $REPO_PATH/Runner/utils/send-to-lava.sh Sensors.res || true

